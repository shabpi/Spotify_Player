<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Now Playing</title>
<style>
  html{background:#000}
  html,body{margin:0;height:100%;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;cursor:none}
  #wave{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
  main{position:relative;height:100%;display:flex;align-items:center;justify-content:center;gap:5vw;padding:5vw;box-sizing:border-box}
  .cover{height:70vh;max-width:45vw;object-fit:cover;border-radius:1.5vh;box-shadow:0 2vh 6vh #000a}
  .t{max-width:40vw}
  h1{font-size:6vh;margin:0 0 1.5vh;line-height:1.1}
  h2{font-size:3.5vh;margin:0 0 .8vh;font-weight:400;opacity:.85}
  h3{font-size:2.5vh;margin:0;font-weight:400;opacity:.55}
  .bar{margin-top:5vh;height:.8vh;background:#fff3;border-radius:1vh;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:#fff}
  main.idle{font-size:4vh;opacity:.7;text-align:center}
  main.paused .cover,main.paused .t{opacity:.35}
  .cover,.t{transition:opacity .6s}
  main.artonly{padding:0}
  main.artonly .cover{height:100vh;max-width:100vw;width:100vh;border-radius:0;box-shadow:none}
  main.artonly .t{display:none}
  #top{position:fixed;top:2.2vh;left:0;right:0;text-align:center;font-size:2.2vh;letter-spacing:.12em;opacity:.65;z-index:2;transition:opacity .4s}
  .corner{position:fixed;right:2.5vw;bottom:3vh;width:15vh;z-index:2;text-align:center}
  .corner img{height:15vh;width:15vh;max-width:none;border-radius:1vh;box-shadow:0 1vh 3vh #000a}
  .corner span{display:block;margin-top:.8vh;font-size:1.6vh;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main.artonly .corner{display:none}
  @media (max-aspect-ratio:1/1){main{flex-direction:column}.cover{height:auto;width:80vw;max-width:80vw}.t{max-width:85vw;text-align:center}h1{font-size:4vh}}
</style>
</head>
<body>
<canvas id="wave"></canvas>
<div id="top"></div>
<main class="idle" onclick="if(!localStorage.refresh)login()">Loading…</main>
<script type="module">
// 1) Create an app at https://developer.spotify.com/dashboard
// 2) Add redirect URI exactly:  http://127.0.0.1:8888/
// 3) Paste the Client ID here (no secret needed, PKCE flow)
const CLIENT_ID = "348a315d861541be9c66a25bdd07438a";
// Name shown at the top: ?name=Lena in the URL (remembered), else your Spotify display name, else this default
const DEFAULT_NAME = "Omar";
const ART_ONLY  = false;   // true = only the big song cover, edge to edge, no text
const POLL_MS   = 4000;
const REDIRECT  = location.origin + location.pathname;   // local: http://127.0.0.1:8888/   GitHub Pages: https://USER.github.io/REPO/
const SCOPE     = "user-read-currently-playing user-read-playback-state playlist-read-private playlist-read-collaborative";

const $ = id => document.getElementById(id);
const main = document.querySelector("main");
{ const q = new URLSearchParams(location.search).get("name"); if (q) localStorage.name = q; }
let NAME = localStorage.name || DEFAULT_NAME;
let nameChecked = false;
async function loadName(tok) {          // use the Spotify display name unless ?name= was given
  if (nameChecked) return; nameChecked = true;
  if (localStorage.name) return;
  try {
    const r = await fetch("https://api.spotify.com/v1/me", {headers: {Authorization: "Bearer " + tok}});
    if (r.ok) { const j = await r.json(); if (j.display_name) NAME = j.display_name; }
  } catch (e) { console.warn(e); }
}
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");

// ---- fullscreen: double-click or press F (on a kiosk Pi it is already fullscreen) ----
const toggleFS = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
document.addEventListener("dblclick", toggleFS);
document.addEventListener("keydown", e => { if (e.key === "f" || e.key === "F") toggleFS(); });

// ---- auth (PKCE) ----
window.login = async () => {
  const verifier = b64(crypto.getRandomValues(new Uint8Array(64)));
  const challenge = b64(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  localStorage.verifier = verifier;
  location = "https://accounts.spotify.com/authorize?" + new URLSearchParams({
    client_id: CLIENT_ID, response_type: "code", redirect_uri: REDIRECT, scope: SCOPE,
    code_challenge_method: "S256", code_challenge: challenge });
};
async function token(body) {
  const r = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST", headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: new URLSearchParams({client_id: CLIENT_ID, ...body}) });
  if (!r.ok) throw new Error("token " + r.status);
  const j = await r.json();
  localStorage.access = j.access_token;
  localStorage.exp = Date.now() + (j.expires_in - 60) * 1000;
  localStorage.scope = SCOPE;
  if (j.refresh_token) localStorage.refresh = j.refresh_token;
}
async function access() {
  if (Date.now() > +localStorage.exp)
    await token({grant_type: "refresh_token", refresh_token: localStorage.refresh});
  return localStorage.access;
}
// scopes changed since last login -> force a fresh login once
if (localStorage.refresh && localStorage.scope && localStorage.scope !== SCOPE) { delete localStorage.refresh; delete localStorage.access; }

// ---- playlist cover (cached; Spotify-owned playlists are blocked for new apps -> falls back to song art) ----
const plCache = new Map();
async function playlistInfo(id, tok) {
  if (plCache.has(id)) return plCache.get(id);
  try {
    const r = await fetch(`https://api.spotify.com/v1/playlists/${id}?fields=name,images`, {headers: {Authorization: "Bearer " + tok}});
    if (r.ok) { const j = await r.json(); const v = {name: j.name, art: j.images?.[0]?.url || ""}; plCache.set(id, v); return v; }
    if (r.status === 403 || r.status === 404) { plCache.set(id, null); return null; }
  } catch (e) { console.warn(e); }
  return null; // transient error: not cached, retry next poll
}

// ---- animated wave background in the two dominant colours of the song art ----
const cv = $("wave"), g2 = cv.getContext("2d");
const SCALE = 0.25;                       // render small, CSS scales up (cheap on a Pi)
const resize = () => { cv.width = Math.ceil(innerWidth * SCALE); cv.height = Math.ceil(innerHeight * SCALE); };
addEventListener("resize", resize); resize();
let colA = [10, 10, 14], colB = [28, 28, 44], tgtA = colA, tgtB = colB, palUrl = "";
const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

function dominant(url) {   // -> [[r,g,b],[r,g,b]]; falls back to calm greys if the image can't be read
  return new Promise(res => {
    const fallback = () => res([[20, 20, 30], [45, 45, 75]]);
    const im = new Image(); im.crossOrigin = "anonymous";
    im.onerror = fallback;
    im.onload = () => {
      try {
        const N = 40, c = document.createElement("canvas"); c.width = c.height = N;
        const x = c.getContext("2d", {willReadFrequently: true}); x.drawImage(im, 0, 0, N, N);
        const d = x.getImageData(0, 0, N, N).data, bins = new Map();
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i], g = d[i + 1], b = d[i + 2], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
          const sat = mx ? (mx - mn) / mx : 0;
          const w = (mx < 35 || mn > 225) ? 0.05 : 0.3 + sat;          // ignore near-black / near-white
          const k = (r >> 4) << 8 | (g >> 4) << 4 | (b >> 4);
          const e = bins.get(k) || {w: 0, r: 0, g: 0, b: 0};
          e.w += w; e.r += r * w; e.g += g * w; e.b += b * w; bins.set(k, e);
        }
        const list = [...bins.values()].sort((p, q) => q.w - p.w).map(e => [e.r / e.w, e.g / e.w, e.b / e.w]);
        const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]);
        const a = list[0];
        let b = list.find(c => dist(c, a) > 90);
        if (!b) b = mix(a, (a[0] + a[1] + a[2]) / 3 > 110 ? [0, 0, 0] : [255, 255, 255], 0.4);
        res([a, b]);
      } catch (e) { fallback(); }      // canvas tainted (no CORS)
    };
    im.src = url;
  });
}
function setPalette(url) {
  if (!url || url === palUrl) return;
  palUrl = url;
  dominant(url).then(([a, b]) => { tgtA = a; tgtB = b; });
}

const LAYERS = [ {y: .52, amp: .09, k: 1.5, sp: .8,  a: .55}, {y: .64, amp: .12, k: 2.3, sp: -.55, a: .5}, {y: .78, amp: .08, k: 3.4, sp: 1.2, a: .6} ];
let t = 0, speed = 1, lastTs = performance.now(), lastDraw = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - lastDraw < 33) return;                       // ~30 fps
  const dt = Math.min(0.1, (now - lastTs) / 1000); lastTs = now; lastDraw = now;
  colA = mix(colA, tgtA, dt * 1.5); colB = mix(colB, tgtB, dt * 1.5);   // colours glide when the song changes
  speed += ((cur && cur.playing ? 1 : 0.15) - speed) * dt * 2;        // waves calm down when paused
  t += dt * speed;
  const W = cv.width, H = cv.height;
  g2.fillStyle = rgba(colA); g2.fillRect(0, 0, W, H);
  for (const L of LAYERS) {
    g2.beginPath(); g2.moveTo(0, H);
    for (let x = 0; x <= W + 3; x += 3) {
      const u = x / W * Math.PI * 2;
      g2.lineTo(x, H * (L.y + L.amp * Math.sin(u * L.k + t * L.sp) + L.amp * .5 * Math.sin(u * L.k * 2.1 - t * L.sp * .7)));
    }
    g2.lineTo(W + 3, H); g2.closePath(); g2.fillStyle = rgba(colB, L.a); g2.fill();
  }
  g2.fillStyle = "rgba(0,0,0,.3)"; g2.fillRect(0, 0, W, H);          // keep the text readable
}
requestAnimationFrame(frame);

// ---- rendering ----
let cur = null; // {progress, duration, at, playing}
const setTop = t => { $("top").textContent = t; };
function idle(msg, resting = true) {
  main.className = "idle"; main.dataset.key = ""; main.textContent = msg || ""; cur = null;
  document.querySelector(".corner")?.remove();
  setTop(resting ? "Eardrums resting ..." : "");
  tgtA = [10, 10, 14]; tgtB = [28, 28, 44]; palUrl = "";
}
function show(it, playing, progress, art, plArt, plName) {
  const sub = it.artists ? it.artists.map(a => a.name).join(", ") : (it.show ? it.show.publisher : "");
  const alb = it.album ? it.album.name : (it.show ? it.show.name : "");
  const key = it.id + "|" + art + "|" + plArt;
  if (main.dataset.key !== key) {
    main.dataset.key = key; main.className = ART_ONLY ? "artonly" : "";
    main.innerHTML = `<img class="cover" alt=""><div class="t"><h1></h1><h2></h2><h3></h3><div class="bar"><i id="p"></i></div></div>`;
    main.querySelector(".cover").src = art;
    main.querySelector("h1").textContent = it.name;
    main.querySelector("h2").textContent = sub;
    main.querySelector("h3").textContent = alb;
    document.querySelector(".corner")?.remove();
    if (plArt) {
      const c = document.createElement("div"); c.className = "corner";
      c.innerHTML = `<img alt=""><span></span>`;
      c.querySelector("img").src = plArt; c.querySelector("span").textContent = plName;
      document.body.appendChild(c);
    }
    setPalette(art);
    document.title = `${it.name} – ${sub}`;
  }
  main.classList.toggle("paused", !playing);
  setTop(playing ? `${NAME} is listening` : "Eardrums resting ...");
  cur = {progress, duration: it.duration_ms, at: Date.now(), playing};
}
setInterval(() => {
  if (!cur || !$("p")) return;
  const p = cur.progress + (cur.playing ? Date.now() - cur.at : 0);
  $("p").style.width = Math.min(100, 100 * p / cur.duration) + "%";
}, 250);

// ---- polling ----
async function poll() {
  let wait = POLL_MS;
  try {
    if (!localStorage.refresh) { idle("Tap to connect Spotify", false); return; }
    const tok = await access();
    loadName(tok);
    const r = await fetch("https://api.spotify.com/v1/me/player/currently-playing?additional_types=episode",
      {headers: {Authorization: "Bearer " + tok}});
    if (r.status === 204) idle("");
    else if (r.status === 429) wait = (+r.headers.get("Retry-After") || 10) * 1000;
    else if (r.status === 401) { await token({grant_type: "refresh_token", refresh_token: localStorage.refresh}); wait = 500; }
    else if (!r.ok) throw new Error("api " + r.status);
    else {
      const j = await r.json();
      if (!j.item) idle("");
      else {
        const imgs = j.item.album ? j.item.album.images : j.item.images;
        const art = imgs?.[0]?.url || "";
        let plArt = "", plName = "";
        if (j.context?.type === "playlist") {
          const info = await playlistInfo(j.context.uri.split(":").pop(), tok);
          if (info?.art) { plArt = info.art; plName = info.name; }
        }
        show(j.item, j.is_playing, j.progress_ms, art, plArt, plName);
      }
    }
  } catch (e) { console.warn(e); }
  setTimeout(poll, wait);
}

(async () => {
  const code = new URLSearchParams(location.search).get("code");
  if (code) {
    try { await token({grant_type: "authorization_code", code, redirect_uri: REDIRECT, code_verifier: localStorage.verifier}); }
    catch (e) { console.warn(e); }
    history.replaceState({}, "", REDIRECT);
  }
  try { await navigator.wakeLock?.request("screen"); } catch {}   // keep the screen on
  document.addEventListener("visibilitychange", async () => { if (!document.hidden) try { await navigator.wakeLock?.request("screen"); } catch {} });
  poll();
})();
</script>
</body>
</html>
